services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toolyard
      POSTGRES_PASSWORD: toolyard
      POSTGRES_DB: toolyard
    ports:
      - "5433:5432"
    volumes:
      - toolyard-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolyard -d toolyard"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  toolyard-db:
